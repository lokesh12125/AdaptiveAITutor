- slug: count-tree-nodes
  title: Count the Nodes
  unit: trees
  difficulty: easy
  pattern: Depth-first traversal
  concepts:
  - depth-first-traversal
  description: |-
    Write `count_nodes(root)`. An empty tree has 0 nodes. Otherwise count this node plus both subtrees.

    `TreeNode` is already defined for you. Each node has `.val`, `.left` and `.right`, and an empty tree is `None`.
  function_name: count_nodes
  starter_code: |
    def count_nodes(root):
        # Write your solution here
        pass
  prelude: |
    class TreeNode:
        def __init__(self, val=0, left=None, right=None):
            self.val = val
            self.left = left
            self.right = right

    def build_tree(values):
        """Build from level order, where None marks a missing node."""
        if not values or values[0] is None:
            return None
        nodes = [None if v is None else TreeNode(v) for v in values]
        children = iter(nodes[1:])
        for node in nodes:
            if node is None:
                continue
            node.left = next(children, None)
            node.right = next(children, None)
        return nodes[0]

    def tree_values(root):
        """Level order values of a tree, for checking a result."""
        if root is None:
            return []
        out, queue = [], [root]
        while queue:
            node = queue.pop(0)
            if node is None:
                out.append(None)
                continue
            out.append(node.val)
            queue.append(node.left)
            queue.append(node.right)
        while out and out[-1] is None:
            out.pop()
        return out
  public: 2
  tests:
  - expr: count_nodes(build_tree([1, 2, 3]))
    expected: 3
  - expr: count_nodes(build_tree([]))
    expected: 0
  - expr: count_nodes(build_tree([1]))
    expected: 1
  - expr: count_nodes(build_tree([1, None, 2, None, 3]))
    expected: 3

  title: Largest Value in a Linked List
  unit: linked-lists
  difficulty: easy
  pattern: Traversal
  concepts:
  - traversal
  description: |-
    Write `max_value(head)` returning the largest value in a non-empty linked list.

    `ListNode` is already defined for you. Each node has `.val` and `.next`, and an empty list is `None`.
  function_name: max_value
  starter_code: |
    def max_value(head):
        # Write your solution here
        pass
  prelude: |
    class ListNode:
        def __init__(self, val=0, next=None):
            self.val = val
            self.next = next

    def build_list(values):
        head = None
        for value in reversed(values):
            head = ListNode(value, head)
        return head

    def to_list(head, limit=10000):
        out = []
        while head is not None and len(out) < limit:
            out.append(head.val)
            head = head.next
        return out
  public: 2

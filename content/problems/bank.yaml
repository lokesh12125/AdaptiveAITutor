  prelude: |
    class ListNode:
        def __init__(self, val=0, next=None):
            self.val = val
            self.next = next

    def build_list(values):
        head = None
        for value in reversed(values):
            head = ListNode(value, head)
        return head

    def to_list(head, limit=10000):
        out = []
        while head is not None and len(out) < limit:
            out.append(head.val)
            head = head.next
        return out

- slug: inorder-traversal
  title: Inorder Traversal
  unit: trees
  difficulty: easy
  concepts: [binary-tree, recursion]
  prelude: &tree_prelude |
    class TreeNode:
        def __init__(self, val=0, left=None, right=None):
            self.val = val
            self.left = left
            self.right = right

    def build_tree(values):
        """Build from level order, where None marks a missing node."""
        if not values or values[0] is None:
            return None
        nodes = [None if v is None else TreeNode(v) for v in values]
        children = iter(nodes[1:])
        for node in nodes:
            if node is None:
                continue
            node.left = next(children, None)
            node.right = next(children, None)
        return nodes[0]
  description: |
    Write `inorder(root)` returning the values of a binary tree in inorder: left subtree, node, right subtree.
    `TreeNode` has `.val`, `.left` and `.right`. An empty tree is `None`.
  starter_code: |
    # TreeNode has .val, .left and .right, and is already defined for you.
    def inorder(root):
        pass
  public: 2
  tests:
    - {setup: "r = build_tree([2, 1, 3])", expr: "inorder(r)", expected: [1, 2, 3]}
    - {setup: "r = None", expr: "inorder(r)", expected: []}
    - {setup: "r = build_tree([1, None, 2, 3])", expr: "inorder(r)", expected: [1, 3, 2]}
    - {setup: "r = build_tree([5])", expr: "inorder(r)", expected: [5]}

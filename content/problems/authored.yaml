- &linked
  slug: reverse-linked-list
  title: Reverse a Linked List
  unit: linked-lists
  difficulty: medium
  concepts: [linked-list, pointers]
  prelude: &list_prelude |
    class ListNode:
        def __init__(self, val=0, next=None):
            self.val = val
            self.next = next

    def build_list(values):
        head = None
        for value in reversed(values):
            head = ListNode(value, head)
        return head

    def to_list(head, limit=10000):
        out = []
        while head is not None and len(out) < limit:
            out.append(head.val)
            head = head.next
        return out
  description: |
    Write `reverse_list(head)` that reverses a singly linked list and returns the new head.

    `ListNode` is available to your code. Each node has `.val` and `.next`, and an empty list is `None`.
  starter_code: |
    # ListNode has .val and .next, and is already defined for you.
    def reverse_list(head):
        pass
  public: 2
  tests:
    - {setup: "h = build_list([1, 2, 3])", expr: "to_list(reverse_list(h))", expected: [3, 2, 1]}
    - {setup: "h = build_list([])", expr: "to_list(reverse_list(h))", expected: []}
    - {setup: "h = build_list([7])", expr: "to_list(reverse_list(h))", expected: [7]}
    - {setup: "h = build_list([1, 1, 2, 2])", expr: "to_list(reverse_list(h))", expected: [2, 2, 1, 1]}

  def max_non_adjacent(values):
      take, skip = 0, 0
      for v in values:
          take, skip = skip + v, max(take, skip)
      return max(take, skip)
fewest-coins: |
  def fewest_coins(coins, amount):
      best = [0] + [None] * amount
      for total in range(1, amount + 1):
          options = [best[total - c] for c in coins if c <= total and best[total - c] is not None]
          if options:
              best[total] = min(options) + 1
      return -1 if best[amount] is None else best[amount]
longest-common-subsequence: |
  def lcs_length(a, b):
      prev = [0] * (len(b) + 1)
      for ch in a:
          cur = [0]
          for j, other in enumerate(b):
              cur.append(prev[j] + 1 if ch == other else max(prev[j + 1], cur[j]))
          prev = cur
      return prev[-1]

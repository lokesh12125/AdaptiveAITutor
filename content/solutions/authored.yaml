  def merge_lists(a, b):
      dummy = tail = ListNode()
      while a and b:
          if a.val <= b.val:
              tail.next, a = a, a.next
          else:
              tail.next, b = b, b.next
          tail = tail.next
      tail.next = a or b
      return dummy.next
detect-cycle: |
  def has_cycle(head):
      slow = fast = head
      while fast and fast.next:
          slow = slow.next
          fast = fast.next.next
          if slow is fast:
              return True
      return False

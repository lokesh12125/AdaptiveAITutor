  def days_until_warmer(temps):
      out = [0] * len(temps)
      stack = []
      for i, t in enumerate(temps):
          while stack and temps[stack[-1]] < t:
              j = stack.pop()
              out[j] = i - j
          stack.append(i)
      return out
queue-from-two-stacks: |
  class StackQueue:
      def __init__(self):
          self.incoming = []
          self.outgoing = []

      def push(self, x):
          self.incoming.append(x)

      def pop(self):
          if not self.outgoing:
              while self.incoming:
                  self.outgoing.append(self.incoming.pop())
          return self.outgoing.pop() if self.outgoing else None

      def size(self):
          return len(self.incoming) + len(self.outgoing)

  def inorder(root):
      if root is None:
          return []
      return inorder(root.left) + [root.val] + inorder(root.right)
search-bst: |
  def bst_contains(root, target):
      while root:
          if target == root.val:
              return True
          root = root.left if target < root.val else root.right
      return False
level-order: |
  def level_order(root):
      levels = []
      current = [root] if root else []
      while current:
          levels.append([n.val for n in current])
          current = [c for n in current for c in (n.left, n.right) if c]
      return levels
graph-has-path: |
  def has_path(graph, start, goal):
      seen = {start}
      stack = [start]
      while stack:
          node = stack.pop()
          if node == goal:
              return True
          for nxt in graph.get(node, []):
              if nxt not in seen:
                  seen.add(nxt)
                  stack.append(nxt)
      return False
bfs-shortest-steps: |
  from collections import deque

  def fewest_steps(graph, start, goal):
      queue = deque([(start, 0)])
      seen = {start}
      while queue:
          node, steps = queue.popleft()
          if node == goal:
              return steps
          for nxt in graph.get(node, []):
              if nxt not in seen:
                  seen.add(nxt)
                  queue.append((nxt, steps + 1))
      return -1
count-islands: |
  def count_islands(grid):
      seen = set()
      count = 0
      for r, row in enumerate(grid):
          for c, cell in enumerate(row):
              if cell == "1" and (r, c) not in seen:
                  count += 1
                  stack = [(r, c)]
                  seen.add((r, c))
                  while stack:
                      y, x = stack.pop()
                      for ny, nx in ((y + 1, x), (y - 1, x), (y, x + 1), (y, x - 1)):
                          if 0 <= ny < len(grid) and 0 <= nx < len(row):
                              if grid[ny][nx] == "1" and (ny, nx) not in seen:
                                  seen.add((ny, nx))
                                  stack.append((ny, nx))
      return count
course-order-possible: |
  def can_finish(n, prereqs):
      indegree = [0] * n
      after = [[] for _ in range(n)]
      for a, b in prereqs:
          indegree[a] += 1
          after[b].append(a)
      ready = [i for i in range(n) if indegree[i] == 0]
      done = 0
      while ready:
          node = ready.pop()
          done += 1
          for nxt in after[node]:
              indegree[nxt] -= 1
              if indegree[nxt] == 0:
                  ready.append(nxt)
      return done == n

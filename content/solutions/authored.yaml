  def dedupe_sorted(nums):
      out = []
      for n in nums:
          if not out or out[-1] != n:
              out.append(n)
      return out
pair-with-target-sum: |
  def pair_sum(nums, target):
      i, j = 0, len(nums) - 1
      while i < j:
          total = nums[i] + nums[j]
          if total == target:
              return [i, j]
          if total < target:
              i += 1
          else:
              j -= 1
      return [-1, -1]

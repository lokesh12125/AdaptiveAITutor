  def move_zeros(nums):
      kept = [n for n in nums if n != 0]
      return kept + [0] * (len(nums) - len(kept))
max-window-sum: |
  def max_window_sum(nums, k):
      if len(nums) < k:
          return None
      window = sum(nums[:k])
      best = window
      for i in range(k, len(nums)):
          window += nums[i] - nums[i - k]
          best = max(best, window)
      return best

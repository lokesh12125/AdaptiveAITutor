merge-sorted-lists-simple: |
  def merge_sorted(a, b):
      i = j = 0
      out = []
      while i < len(a) and j < len(b):
          if a[i] <= b[j]:
              out.append(a[i])
              i += 1
          else:
              out.append(b[j])
              j += 1
      return out + a[i:] + b[j:]

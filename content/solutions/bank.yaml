  import heapq

  def cheapest(n, edges, start, end):
      graph = [[] for _ in range(n)]
      for a, b, cost in edges:
          graph[a].append((b, cost))
      best = {start: 0}
      heap = [(0, start)]
      while heap:
          spent, node = heapq.heappop(heap)
          if node == end:
              return spent
          if spent > best.get(node, float('inf')):
              continue
          for next_node, cost in graph[node]:
              total = spent + cost
              if total < best.get(next_node, float('inf')):
                  best[next_node] = total
                  heapq.heappush(heap, (total, next_node))
      return -1

          return False
      graph = [[] for _ in range(n)]
      for a, b in edges:
          graph[a].append(b)
          graph[b].append(a)
      seen = {0}
      stack = [0]
      while stack:
          node = stack.pop()
          for nxt in graph[node]:
              if nxt not in seen:
                  seen.add(nxt)
                  stack.append(nxt)
      return len(seen) == n

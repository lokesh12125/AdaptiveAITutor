      lo, hi = max(weights), sum(weights)
      while lo < hi:
          mid = (lo + hi) // 2
          used, load = 1, 0
          for w in weights:
              if load + w > mid:
                  used += 1
                  load = 0
              load += w
          if used <= days:
              hi = mid
          else:
              lo = mid + 1
      return lo

      for a, b in edges:
          graph[a].append(b)
          graph[b].append(a)
      seen = set()
      def walk(node, parent):
          seen.add(node)
          for next_node in graph[node]:
              if next_node == parent:
                  continue
              if next_node in seen or walk(next_node, node):
                  return True
          return False
      return any(start not in seen and walk(start, -1) for start in range(n))

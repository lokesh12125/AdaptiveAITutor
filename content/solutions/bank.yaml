      def walk(text, opened, closed):
          if len(text) == 2 * n:
              out.append(text)
              return
          if opened < n:
              walk(text + "(", opened + 1, closed)
          if closed < opened:
              walk(text + ")", opened, closed + 1)
      walk("", 0, 0)
      return sorted(out)

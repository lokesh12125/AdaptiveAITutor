  import heapq

  def task_order(n, rules):
      after = [[] for _ in range(n)]
      needs = [0] * n
      for a, b in rules:
          after[b].append(a)
          needs[a] += 1
      ready = [t for t in range(n) if needs[t] == 0]
      heapq.heapify(ready)
      out = []
      while ready:
          task = heapq.heappop(ready)
          out.append(task)
          for next_task in after[task]:
              needs[next_task] -= 1
              if needs[next_task] == 0:
                  heapq.heappush(ready, next_task)
      return out if len(out) == n else []

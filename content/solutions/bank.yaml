              return 1
          total = count(length - 1, False)
          if not last_was_one:
              total += count(length - 1, True)
          return total
      return count(n, False)
grid-paths-with-diagonal-steps: |
  from functools import cache

  def paths(rows, cols):
      @cache
      def ways(r, c):
          if r == 0 or c == 0:
              return 1
          return ways(r - 1, c) + ways(r, c - 1) + ways(r - 1, c - 1)
      return ways(rows - 1, cols - 1)

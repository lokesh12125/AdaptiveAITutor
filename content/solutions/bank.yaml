      while lo <= hi:
          mid = (lo + hi) // 2
          if nums[mid] == x:
              return mid
          if nums[lo] <= nums[mid]:
              if nums[lo] <= x < nums[mid]:
                  hi = mid - 1
              else:
                  lo = mid + 1
          else:
              if nums[mid] < x <= nums[hi]:
                  lo = mid + 1
              else:
                  hi = mid - 1
      return -1

  def rearranged_starts(text, pattern):
      k = len(pattern)
      if k == 0 or k > len(text):
          return []
      want = Counter(pattern)
      window = Counter(text[:k])
      out = [0] if window == want else []
      for i in range(k, len(text)):
          window[text[i]] += 1
          window[text[i - k]] -= 1
          if window[text[i - k]] == 0:
              del window[text[i - k]]
          if window == want:
              out.append(i - k + 1)
      return out

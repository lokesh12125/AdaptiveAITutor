  def queens(n):
      def walk(row, cols, up, down):
          if row == n:
              return 1
          total = 0
          for c in range(n):
              if c in cols or row + c in up or row - c in down:
                  continue
              total += walk(row + 1, cols | {c}, up | {row + c}, down | {row - c})
          return total
      return walk(0, set(), set(), set())

          return items[:]
      mid = len(items) // 2
      left, right = merge_sort(items[:mid]), merge_sort(items[mid:])
      out, i, j = [], 0, 0
      while i < len(left) and j < len(right):
          if left[i] <= right[j]:
              out.append(left[i])
              i += 1
          else:
              out.append(right[j])
              j += 1
      return out + left[i:] + right[j:]

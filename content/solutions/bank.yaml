  def terms(n, rules):
      after = [[] for _ in range(n)]
      needs = [0] * n
      for a, b in rules:
          after[b].append(a)
          needs[a] += 1
      current = [c for c in range(n) if needs[c] == 0]
      count = 0
      while current:
          count += 1
          following = []
          for course in current:
              for nxt in after[course]:
                  needs[nxt] -= 1
                  if needs[nxt] == 0:
                      following.append(nxt)
          current = following
      return count

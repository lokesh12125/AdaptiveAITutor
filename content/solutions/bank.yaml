  def longest_chain(n, rules):
      after = [[] for _ in range(n)]
      needs = [0] * n
      for a, b in rules:
          after[b].append(a)
          needs[a] += 1
      length = [1] * n
      queue = deque(t for t in range(n) if needs[t] == 0)
      while queue:
          task = queue.popleft()
          for next_task in after[task]:
              length[next_task] = max(length[next_task], length[task] + 1)
              needs[next_task] -= 1
              if needs[next_task] == 0:

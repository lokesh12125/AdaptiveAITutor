  from collections import deque

  def process_queue_requests(requests):
      queue = deque(requests)
      out = []
      while queue:
          out.append(queue.popleft())
      return out
recursive-power: |
  def fast_pow(x, n):
      if n == 0:
          return 1
      half = fast_pow(x, n // 2)
      return half * half if n % 2 == 0 else half * half * x
binary-tree-maximum-depth: |
  class TreeNode:
      def __init__(self, val=0, left=None, right=None):
          self.val = val
          self.left = left
          self.right = right

  def max_depth(root):
      if root is None:
          return 0
      return 1 + max(max_depth(root.left), max_depth(root.right))
invert-binary-tree: |
  class TreeNode:
      def __init__(self, val=0, left=None, right=None):
          self.val = val
          self.left = left
          self.right = right

  def invert_tree(root):
      if root:
          root.left, root.right = invert_tree(root.right), invert_tree(root.left)
      return root
two-pointer-palindrome: |
  def is_palindrome_fast(s):
      i, j = 0, len(s) - 1
      while i < j:
          if s[i] != s[j]:
              return False
          i += 1
          j -= 1
      return True

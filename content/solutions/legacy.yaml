prime-numbers-count: |
  def count_primes(numbers):
      def is_prime(n):
          if n < 2:
              return False
          d = 2
          while d * d <= n:
              if n % d == 0:
                  return False
              d += 1
          return True
      return sum(1 for n in numbers if is_prime(n))

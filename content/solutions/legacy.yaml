          n += 2
binary-search: |
  def binary_search(arr, target):
      lo, hi = 0, len(arr) - 1
      while lo <= hi:
          mid = (lo + hi) // 2
          if arr[mid] == target:
              return mid
          if arr[mid] < target:
              lo = mid + 1
          else:
              hi = mid - 1
      return -1
bubble-sort-implementation: |
  def bubble_sort(arr):
      arr = list(arr)
      for i in range(len(arr)):
          for j in range(len(arr) - i - 1):
              if arr[j] > arr[j + 1]:
                  arr[j], arr[j + 1] = arr[j + 1], arr[j]
      return arr
two-sum-fast: |
  def two_sum_fast(numbers, target):
      seen = {}
      for i, n in enumerate(numbers):
          if target - n in seen:
              return [seen[target - n], i]
          seen[n] = i
      return None
valid-parentheses: |
  def is_valid_parentheses(s):
      pairs = {")": "(", "]": "[", "}": "{"}
      stack = []
      for ch in s:
          if ch in pairs:
              if not stack or stack.pop() != pairs[ch]:
                  return False
          else:
              stack.append(ch)
      return not stack
